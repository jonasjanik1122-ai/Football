<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07130d">
<link rel="manifest" href="manifest.json">
<title>Soccer Challenge ⚽</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#07130d;
color:white;
text-align:center;
min-height:100vh;
overflow:hidden;
touch-action:none
}

.screen{
display:none;
min-height:100vh;
padding:20px
}

.active{display:block}

h1{font-size:38px;margin:35px 0 15px}
h2{margin:15px}

button{
border:0;
border-radius:14px;
padding:14px 22px;
margin:7px;
font-size:17px;
font-weight:bold;
background:#20d66b;
color:#031008
}

.top{
display:flex;
justify-content:space-around;
font-size:18px;
margin:10px
}

/* LEVEL */
.levels{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
max-width:600px;
margin:15px auto;
max-height:70vh;
overflow:auto
}

.level{
background:#12251a;
color:white;
padding:13px 4px
}

.locked{
opacity:.3
}

/* SPIELFELD */
#field{
position:relative;
width:100%;
max-width:700px;
height:65vh;
margin:auto;
background:
repeating-linear-gradient(
90deg,
#159447 0,
#159447 50px,
#12843f 50px,
#12843f 100px
);
border:5px solid white;
border-radius:18px;
overflow:hidden
}

/* TOR RECHTS */
#goal{
position:absolute;
right:8px;
top:35%;
width:85px;
height:30%;
border:6px solid white;
border-right:0;
font-size:38px;
display:flex;
align-items:center;
justify-content:center
}

/* BALL LINKS */
#ball{
position:absolute;
left:25px;
top:50%;
font-size:45px;
transform:translateY(-50%);
z-index:5
}

/* LINIE */
#line{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
z-index:4
}

/* HINDERNISSE */
.obstacle{
position:absolute;
font-size:42px;
z-index:3
}

#message{
font-size:21px;
margin:10px
}
</style>
</head>

<body>

<!-- HAUPTMENÜ -->
<section id="home" class="screen active">

<h1>⚽ Soccer Challenge</h1>

<p>1000 Level warten auf dich!</p>

<br>

<button onclick="openLevels()">
▶ SPIELEN
</button>

<br>

<button onclick="openAdmin()">
🔐 ADMIN
</button>

</section>


<!-- LEVELAUSWAHL -->
<section id="levels" class="screen">

<h2>🏆 LEVEL</h2>

<div id="levelList" class="levels"></div>

<button onclick="show('home')">
⬅ Menü
</button>

</section>


<!-- SPIEL -->
<section id="gameScreen" class="screen">

<div class="top">

<span>
Level <b id="levelText">1</b>
</span>

<span>
⭐ <b id="score">0</b>
</span>

<span>
⏱️ <b id="time">30</b>
</span>

</div>

<div id="field">

<div id="goal">🥅</div>

<div id="ball">⚽</div>

<canvas id="line"></canvas>

</div>

<div id="message">
Zeichne eine Linie zum Tor!
</div>

<button onclick="resetShot()">
🔄 Neu
</button>

<button onclick="show('levels')">
⬅ Level
</button>

</section>


<!-- ADMIN -->
<section id="admin" class="screen">

<h2>🔐 Admin</h2>

<div id="login">

<input
id="password"
type="password"
placeholder="Admin-Passwort"
style="padding:12px;border-radius:10px;border:0"
>

<br>

<button onclick="login()">
Einloggen
</button>

</div>

<div id="adminContent" style="display:none">

<p>Dein gespeichertes Level:</p>

<h2 id="adminLevel">1</h2>

<button onclick="resetGame()">
🔄 Spielstand zurücksetzen
</button>

<br>

<button onclick="show('home')">
⬅ Menü
</button>

</div>

</section>


<script type="module">

/* =================================
   FIREBASE
================================= */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getDatabase,
ref,
set,
get
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyB9JbpYKnTvBRmIvG5g0s1K6SDeVnC2wi4",

authDomain:"soccergame-3e8e5.firebaseapp.com",

projectId:"soccergame-3e8e5",

storageBucket:"soccergame-3e8e5.firebasestorage.app",

messagingSenderId:"410350098489",

appId:"1:410350098489:web:b2f76518d8e55a51c395e8",

measurementId:"G-9X44KJK0P1"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* =================================
   SPIELER-ID
================================= */

let playerId=
localStorage.getItem("soccerPlayerId");

if(!playerId){

playerId=
"player_"+crypto.randomUUID();

localStorage.setItem(
"soccerPlayerId",
playerId
);

}


/* =================================
   SPIELDATEN
================================= */

const MAX_LEVEL=1000;

let level=
Number(localStorage.getItem("level")||1);

let score=0;

let time=30;

let timer;

let drawing=false;

let points=[];


/* =================================
   ELEMENTE
================================= */

const field=
document.getElementById("field");

const canvas=
document.getElementById("line");

const ctx=
canvas.getContext("2d");


function resizeCanvas(){

canvas.width=field.clientWidth;

canvas.height=field.clientHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* =================================
   SCREEN
================================= */

window.show=function(id){

document
.querySelectorAll(".screen")
.forEach(s=>
s.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

if(id!=="gameScreen"){

clearInterval(timer);

}

};


/* =================================
   LEVEL
================================= */

window.openLevels=function(){

show("levels");

createLevels();

};


function createLevels(){

const box=
document.getElementById("levelList");

box.innerHTML="";

for(let i=1;i<=MAX_LEVEL;i++){

const b=
document.createElement("button");

b.className="level";

if(i<=level){

b.textContent="⚽ "+i;

b.onclick=()=>startLevel(i);

}else{

b.textContent="🔒 "+i;

b.classList.add("locked");

b.disabled=true;

}

box.appendChild(b);

}

}


/* =================================
   LEVEL START
================================= */

function startLevel(l){

level=l;

score=0;

time=
Math.max(
8,
35-Math.floor(level/40)
);

document.getElementById(
"levelText"
).textContent=level;

document.getElementById(
"score"
).textContent=score;

document.getElementById(
"time"
).textContent=time;

document.getElementById(
"message"
).textContent=
"Zeichne eine Linie zum Tor!";

show("gameScreen");

createObstacles();

resetShot();

clearInterval(timer);

timer=setInterval(()=>{

time--;

document.getElementById(
"time"
).textContent=time;

if(time<=0){

clearInterval(timer);

document.getElementById(
"message"
).textContent=
"⏰ Zeit abgelaufen!";

}

},1000);

}


/* =================================
   HINDERNISSE
================================= */

function createObstacles(){

document
.querySelectorAll(".obstacle")
.forEach(x=>x.remove());

let amount=
Math.min(
15,
2+Math.floor(level/70)
);

for(let i=0;i<amount;i++){

let obstacle=
document.createElement("div");

obstacle.className="obstacle";

obstacle.textContent="🧱";

obstacle.style.left=
(15+Math.random()*65)+"%";

obstacle.style.top=
(10+Math.random()*75)+"%";

field.appendChild(obstacle);

}

}


/* =================================
   ZEICHNEN
================================= */

function getPosition(e){

const rect=
canvas.getBoundingClientRect();

const touch=
e.touches ? e.touches[0] : e;

return{

x:touch.clientX-rect.left,

y:touch.clientY-rect.top

};

}


canvas.addEventListener(
"pointerdown",
e=>{

drawing=true;

points=[];

const p=getPosition(e);

points.push(p);

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

}
);


canvas.addEventListener(
"pointermove",
e=>{

if(!drawing)return;

const p=getPosition(e);

points.push(p);

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.beginPath();

ctx.moveTo(
points[0].x,
points[0].y
);

for(let i=1;i<points.length;i++){

ctx.lineTo(
points[i].x,
points[i].y
);

}

ctx.strokeStyle="#ffffff";

ctx.lineWidth=7;

ctx.lineCap="round";

ctx.stroke();

}
);


canvas.addEventListener(
"pointerup",
()=>{

if(!drawing)return;

drawing=false;

checkShot();

}
);


/* =================================
   SCHUSS PRÜFEN
================================= */

function checkShot(){

if(points.length<10){

document.getElementById(
"message"
).textContent=
"✏️ Zeichne eine längere Linie!";

return;

}

const end=
points[points.length-1];

const goalX=
canvas.width-80;

const goalTop=
canvas.height*.35;

const goalBottom=
canvas.height*.65;


/* Tor getroffen? */

if(
end.x>goalX &&
end.y>goalTop &&
end.y<goalBottom
){

score++;

document.getElementById(
"score"
).textContent=score;

document.getElementById(
"message"
).textContent=
"⚽ TOOOOR!";

saveGame();

setTimeout(()=>{

if(score>=getNeededGoals()){

nextLevel();

}else{

resetShot();

}

},700);

}else{

document.getElementById(
"message"
).textContent=
"❌ Linie erreicht das Tor nicht!";

}

}


function getNeededGoals(){

return Math.min(
3,
1+Math.floor(level/250)
);

}


/* =================================
   NEUER SCHUSS
================================= */

window.resetShot=function(){

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

points=[];

};


/* =================================
   NÄCHSTES LEVEL
================================= */

function nextLevel(){

clearInterval(timer);

if(level<MAX_LEVEL){

level++;

localStorage.setItem(
"level",
level
);

saveGame();

document.getElementById(
"message"
).textContent=
"🏆 Level geschafft!";

setTimeout(()=>{

startLevel(level);

},800);

}else{

document.getElementById(
"message"
).textContent=
"👑 ALLE 1000 LEVEL GESCHAFFT!";

}

}


/* =================================
   FIREBASE SPEICHERN
================================= */

async function saveGame(){

try{

await set(
ref(db,"players/"+playerId),
{

level:level,

score:score,

updatedAt:Date.now()

}

);

}catch(error){

console.error(
"Firebase Fehler:",
error
);

}

}


/* =================================
   FIREBASE LADEN
================================= */

async function loadGame(){

try{

const snapshot=
await get(
ref(db,"players/"+playerId)
);

if(snapshot.exists()){

const data=snapshot.val();

if(data.level){

level=
Math.max(
1,
Math.min(
MAX_LEVEL,
Number(data.level)
)
);

localStorage.setItem(
"level",
level
);

}

}

}catch(error){

console.error(
"Firebase Laden:",
error
);

}

}


/* =================================
   ADMIN
================================= */

window.openAdmin=function(){

show("admin");

};


window.login=function(){

/*
Für den endgültigen Release
kommt hier Firebase Authentication hin.
*/

const password=
document.getElementById(
"password"
).value;

if(password==="1233"){

document.getElementById(
"login"
).style.display="none";

document.getElementById(
"adminContent"
).style.display="block";

document.getElementById(
"adminLevel"
).textContent=level;

}else{

alert(
"❌ Falsches Passwort"
);

}

};


window.resetGame=function(){

if(confirm(
"Spielstand wirklich zurücksetzen?"
)){

level=1;

score=0;

localStorage.setItem(
"level",
1
);

saveGame();

document.getElementById(
"adminLevel"
).textContent=1;

alert(
"✅ Spielstand zurückgesetzt!"
);

}

};


/* =================================
   START
================================= */

await loadGame();

createLevels();

console.log(
"⚽ Soccer gestartet",
playerId
);

</script>

</body>
</html>
