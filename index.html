<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07130d">
<link rel="manifest" href="manifest.json">
<title>Soccer Challenge ⚽</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#07130d;
  color:white;
  text-align:center;
  min-height:100vh;
  overflow:hidden;
  touch-action:none
}

.screen{
  display:none;
  min-height:100vh;
  padding:20px
}

.active{
  display:block
}

h1{
  font-size:38px;
  margin:35px 0 15px
}

h2{
  margin:15px
}

button{
  border:0;
  border-radius:14px;
  padding:14px 22px;
  margin:7px;
  font-size:17px;
  font-weight:bold;
  background:#20d66b;
  color:#031008;
  cursor:pointer
}

button:active{
  transform:scale(.96)
}

input{
  padding:13px;
  border-radius:10px;
  border:0;
  margin:6px;
  font-size:16px;
  max-width:300px;
  width:90%
}

.top{
  display:flex;
  justify-content:space-around;
  font-size:18px;
  margin:10px
}

/* LEVEL */
.levels{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  max-width:600px;
  margin:15px auto;
  max-height:70vh;
  overflow:auto
}

.level{
  background:#12251a;
  color:white;
  padding:13px 4px
}

.locked{
  opacity:.3
}

/* SPIELFELD */
#field{
  position:relative;
  width:100%;
  max-width:700px;
  height:65vh;
  margin:auto;
  background:
  repeating-linear-gradient(
    90deg,
    #159447 0,
    #159447 50px,
    #12843f 50px,
    #12843f 100px
  );
  border:5px solid white;
  border-radius:18px;
  overflow:hidden
}

/* TOR RECHTS */
#goal{
  position:absolute;
  right:8px;
  top:35%;
  width:85px;
  height:30%;
  border:6px solid white;
  border-right:0;
  font-size:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2
}

/* BALL LINKS */
#ball{
  position:absolute;
  left:25px;
  top:50%;
  font-size:45px;
  transform:translateY(-50%);
  z-index:5
}

/* ZEICHENFLÄCHE */
#line{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:10
}

/* HINDERNISSE */
.obstacle{
  position:absolute;
  font-size:42px;
  z-index:3;
  pointer-events:none
}

#message{
  font-size:21px;
  margin:10px
}

/* ADMIN */
.adminBox{
  background:#12251a;
  border-radius:14px;
  padding:15px;
  margin:12px auto;
  max-width:650px;
  text-align:left
}

.player{
  background:#0b1d13;
  border-radius:12px;
  padding:14px;
  margin:10px 0
}

.player button{
  font-size:14px;
  padding:10px
}

.danger{
  background:#e53935;
  color:white
}

.gray{
  background:#777;
  color:white
}

.status{
  color:#20d66b;
  font-weight:bold
}
</style>
</head>

<body>


<!-- =========================
     HAUPTMENÜ
========================= -->

<section id="home" class="screen active">

<h1>⚽ Soccer Challenge</h1>

<p>Schaffe alle 1000 Level!</p>

<br>

<button onclick="openLevels()">
▶ SPIELEN
</button>

<br>

<button onclick="openLogin()">
🔐 ADMIN
</button>

<p id="loginStatus" style="margin-top:20px;color:#aaa">
Nicht angemeldet
</p>

</section>


<!-- =========================
     LEVELAUSWAHL
========================= -->

<section id="levels" class="screen">

<h2>🏆 LEVEL</h2>

<div id="levelList" class="levels"></div>

<button onclick="show('home')">
⬅ Menü
</button>

</section>


<!-- =========================
     SPIEL
========================= -->

<section id="gameScreen" class="screen">

<div class="top">

<span>
Level <b id="levelText">1</b>
</span>

<span>
⭐ <b id="score">0</b>
</span>

<span>
⏱️ <b id="time">30</b>
</span>

</div>


<div id="field">

<div id="goal">🥅</div>

<div id="ball">⚽</div>

<canvas id="line"></canvas>

</div>


<div id="message">
Zeichne eine Linie zum Tor!
</div>


<button onclick="resetShot()">
🔄 Neu
</button>

<button onclick="show('levels')">
⬅ Level
</button>

</section>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen" class="screen">

<h2>🔐 Admin Login</h2>

<input
id="email"
type="email"
placeholder="E-Mail"
autocomplete="username"
>

<br>

<input
id="password"
type="password"
placeholder="Passwort"
autocomplete="current-password"
>

<br>

<button onclick="login()">
🔓 Einloggen
</button>

<button onclick="show('home')">
⬅ Zurück
</button>

<p id="loginMessage"></p>

</section>


<!-- =========================
     ADMIN
========================= -->

<section id="admin" class="screen">

<h2>🔐 Admin Panel</h2>

<div class="adminBox">

<p>
Admin:
<span class="status">● Angemeldet</span>
</p>

<p style="margin-top:8px">
Spieler in Datenbank:
<b id="playerCount">0</b>
</p>

</div>


<div class="adminBox">

<h3>🔎 Spieler suchen</h3>

<input
id="searchPlayer"
placeholder="Spieler-ID suchen..."
oninput="filterPlayers()"
>

</div>


<div class="adminBox">

<h3>👥 Spieler</h3>

<div id="playerList">
Lade Spieler...
</div>

</div>


<button onclick="loadPlayers()">
🔄 Aktualisieren
</button>

<button onclick="logout()">
🚪 Ausloggen
</button>

<button onclick="show('home')">
⬅ Menü
</button>

</section>


<!-- =========================
     JAVASCRIPT
========================= -->

<script type="module">

/* FIREBASE */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  update,
  remove
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:"AIzaSyB9JbpYKnTvBRmIvG5g0s1K6SDeVnC2wi4",

authDomain:"soccergame-3e8e5.firebaseapp.com",

projectId:"soccergame-3e8e5",

storageBucket:"soccergame-3e8e5.firebasestorage.app",

messagingSenderId:"410350098489",

appId:"1:410350098489:web:b2f76518d8e55a51c395e8",

measurementId:"G-9X44KJK0P1"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const auth=getAuth(app);


/* DEINE ADMIN UID */

const ADMIN_UID=
"lotAq5DnKXVxKkiAlbNckrQTtHw1";


/* SPIELER-ID */

let playerId=
localStorage.getItem("soccerPlayerId");

if(!playerId){

playerId=
"player_"+crypto.randomUUID();

localStorage.setItem(
"soccerPlayerId",
playerId
);

}


/* SPIELDATEN */

const MAX_LEVEL=1000;

let level=
Number(localStorage.getItem("level")||1);

let score=0;

let time=30;

let timer=null;

let drawing=false;

let points=[];

let allPlayers={};


/* ELEMENTE */

const field=
document.getElementById("field");

const canvas=
document.getElementById("line");

const ctx=
canvas.getContext("2d");


function resizeCanvas(){

canvas.width=field.clientWidth;

canvas.height=field.clientHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* =========================
   SCREEN
========================= */

window.show=function(id){

document
.querySelectorAll(".screen")
.forEach(s=>
s.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

if(id!=="gameScreen"){

clearInterval(timer);

}

};


/* =========================
   LEVEL
========================= */

window.openLevels=function(){

show("levels");

createLevels();

};


function createLevels(){

const box=
document.getElementById("levelList");

box.innerHTML="";

for(let i=1;i<=MAX_LEVEL;i++){

const b=
document.createElement("button");

b.className="level";

if(i<=level){

b.textContent="⚽ "+i;

b.onclick=()=>startLevel(i);

}else{

b.textContent="🔒 "+i;

b.classList.add("locked");

b.disabled=true;

}

box.appendChild(b);

}

}


/* =========================
   LEVEL START
========================= */

function startLevel(l){

level=l;

score=0;

time=
Math.max(
8,
35-Math.floor(level/40)
);

document.getElementById(
"levelText"
).textContent=level;

document.getElementById(
"score"
).textContent=score;

document.getElementById(
"time"
).textContent=time;

document.getElementById(
"message"
).textContent=
"Zeichne eine Linie zum Tor!";

show("gameScreen");

createObstacles();

resetShot();

clearInterval(timer);

timer=setInterval(()=>{

time--;

document.getElementById(
"time"
).textContent=time;

if(time<=0){

clearInterval(timer);

document.getElementById(
"message"
).textContent=
"⏰ Zeit abgelaufen!";

}

},1000);

}


/* =========================
   HINDERNISSE
========================= */

function createObstacles(){

document
.querySelectorAll(".obstacle")
.forEach(x=>x.remove());

let amount=
Math.min(
15,
2+Math.floor(level/70)
);

for(let i=0;i<amount;i++){

let obstacle=
document.createElement("div");

obstacle.className="obstacle";

obstacle.textContent="🧱";

obstacle.style.left=
(15+Math.random()*65)+"%";

obstacle.style.top=
(10+Math.random()*75)+"%";

field.appendChild(obstacle);

}

}


/* =========================
   POSITION
========================= */

function getPosition(e){

const rect=
canvas.getBoundingClientRect();

return{
x:e.clientX-rect.left,
y:e.clientY-rect.top
};

}


/* =========================
   ZEICHNEN
========================= */

canvas.addEventListener(
"pointerdown",
e=>{

drawing=true;

points=[];

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

const p=getPosition(e);

points.push(p);

canvas.setPointerCapture(e.pointerId);

}
);


canvas.addEventListener(
"pointermove",
e=>{

if(!drawing)return;

const p=getPosition(e);

points.push(p);

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

if(points.length<2)return;

ctx.beginPath();

ctx.moveTo(
points[0].x,
points[0].y
);

for(let i=1;i<points.length;i++){

ctx.lineTo(
points[i].x,
points[i].y
);

}

ctx.strokeStyle="#ffffff";

ctx.lineWidth=7;

ctx.lineCap="round";

ctx.lineJoin="round";

ctx.stroke();

}
);


canvas.addEventListener(
"pointerup",
e=>{

if(!drawing)return;

drawing=false;

try{
canvas.releasePointerCapture(
e.pointerId
);
}catch{}

checkShot();

}
);


/* =========================
   SCHUSS
========================= */

function checkShot(){

if(points.length<10){

document.getElementById(
"message"
).textContent=
"✏️ Zeichne eine längere Linie!";

return;

}


const end=
points[points.length-1];

const goalX=
canvas.width-90;

const goalTop=
canvas.height*.35;

const goalBottom=
canvas.height*.65;


/* Prüfen ob Linie Hindernisse berührt */

let blocked=false;

document
.querySelectorAll(".obstacle")
.forEach(ob=>{

const r=
ob.getBoundingClientRect();

const fr=
field.getBoundingClientRect();

const ox=
r.left-fr.left;

const oy=
r.top-fr.top;

const ow=r.width;

const oh=r.height;


for(const p of points){

if(
p.x>ox-10 &&
p.x<ox+ow+10 &&
p.y>oy-10 &&
p.y<oy+oh+10
){

blocked=true;

break;

}

}

});


if(blocked){

document.getElementById(
"message"
).textContent=
"💥 Dein Schuss wurde blockiert!";

resetShot();

return;

}


/* TOR */

if(
end.x>goalX &&
end.y>goalTop &&
end.y<goalBottom
){

score++;

document.getElementById(
"score"
).textContent=score;

document.getElementById(
"message"
).textContent=
"⚽ TOOOOR!";

saveGame();

setTimeout(()=>{

if(score>=getNeededGoals()){

nextLevel();

}else{

resetShot();

}

},700);

}else{

document.getElementById(
"message"
).textContent=
"❌ Nicht im Tor!";

}

}


function getNeededGoals(){

return Math.min(
3,
1+Math.floor(level/250)
);

}


/* =========================
   RESET SCHUSS
========================= */

window.resetShot=function(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

points=[];

};


/* =========================
   NÄCHSTES LEVEL
========================= */

function nextLevel(){

clearInterval(timer);

if(level<MAX_LEVEL){

level++;

localStorage.setItem(
"level",
level
);

saveGame();

document.getElementById(
"message"
).textContent=
"🏆 Level geschafft!";

setTimeout(
()=>startLevel(level),
800
);

}else{

document.getElementById(
"message"
).textContent=
"👑 ALLE 1000 LEVEL GESCHAFFT!";

}

}


/* =========================
   SPIELSTAND SPEICHERN
========================= */

async function saveGame(){

try{

await set(
ref(
db,
"players/"+playerId
),
{

level:level,

score:score,

updatedAt:Date.now(),

blocked:false

}

);

}catch(error){

console.error(
"Firebase Speichern:",
error
);

}

}


/* =========================
   SPIELSTAND LADEN
========================= */

async function loadGame(){

try{

const snapshot=
await get(
ref(
db,
"players/"+playerId
)
);

if(snapshot.exists()){

const data=
snapshot.val();

if(data.level){

level=
Math.max(
1,
Math.min(
MAX_LEVEL,
Number(data.level)
)
);

localStorage.setItem(
"level",
level
);

}

}

}catch(error){

console.error(
"Firebase Laden:",
error
);

}

}


/* =========================
   ADMIN LOGIN
========================= */

window.openLogin=function(){

show("loginScreen");

};


window.login=async function(){

const email=
document.getElementById(
"email"
).value.trim();

const password=
document.getElementById(
"password"
).value;


if(!email||!password){

document.getElementById(
"loginMessage"
).textContent=
"Bitte E-Mail und Passwort eingeben.";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

document.getElementById(
"loginMessage"
).textContent=
"❌ Login fehlgeschlagen.";

console.error(error);

}

};


/* =========================
   AUTH STATUS
========================= */

onAuthStateChanged(
auth,
user=>{

if(!user){

document.getElementById(
"loginStatus"
).textContent=
"Nicht angemeldet";

return;

}


if(user.uid===ADMIN_UID){

document.getElementById(
"loginStatus"
).textContent=
"🔐 Admin angemeldet";

show("admin");

loadPlayers();

}else{

signOut(auth);

alert(
"❌ Dieses Konto hat keine Admin-Berechtigung."
);

}

}
);


/* =========================
   SPIELER LADEN
========================= */

window.loadPlayers=async function(){

if(!auth.currentUser||
auth.currentUser.uid!==ADMIN_UID){

return;

}


const list=
document.getElementById(
"playerList"
);

list.innerHTML=
"Lade Spieler...";


try{

const snapshot=
await get(
ref(db,"players")
);


if(!snapshot.exists()){

list.innerHTML=
"Keine Spieler vorhanden.";

document.getElementById(
"playerCount"
).textContent="0";

return;

}


allPlayers=
snapshot.val();

document.getElementById(
"playerCount"
).textContent=
Object.keys(allPlayers).length;

renderPlayers(allPlayers);


}catch(error){

list.innerHTML=
"❌ Fehler beim Laden.";

console.error(error);

}

};


/* =========================
   SPIELER ANZEIGEN
========================= */

function renderPlayers(players){

const list=
document.getElementById(
"playerList"
);

list.innerHTML="";


Object.entries(players)
.forEach(([id,data])=>{

const div=
document.createElement("div");

div.className="player";

const safeLevel=
Number(data.level||1);

const safeScore=
Number(data.score||0);

const blocked=
data.blocked===true;

div.innerHTML=`

<b>🆔 ${escapeHTML(id)}</b>

<br><br>

📊 Level:
<b>${safeLevel}</b>

<br>

⭐ Punkte:
<b>${safeScore}</b>

<br>

Status:
<b class="${blocked?"danger":"status"}">
${blocked?"🔒 Gesperrt":"🟢 Aktiv"}
</b>

<br><br>

<button onclick="changeLevel('${escapeAttr(id)}')">
✏️ Level
</button>

<button onclick="changeScore('${escapeAttr(id)}')">
⭐ Punkte
</button>

<button onclick="resetPlayer('${escapeAttr(id)}')">
🔄 Reset
</button>

<button onclick="toggleBlock('${escapeAttr(id)}')">
${blocked?"🔓 Entsperren":"🔒 Sperren"}
</button>

<button class="danger"
onclick="deletePlayer('${escapeAttr(id)}')">
🗑️ Löschen
</button>
`;

list.appendChild(div);

});

}


/* =========================
   SUCHEN
========================= */

window.filterPlayers=function(){

const search=
document.getElementById(
"searchPlayer"
).value
.toLowerCase()
.trim();

const filtered={};

Object.entries(allPlayers)
.forEach(([id,data])=>{

if(id.toLowerCase().includes(search)){

filtered[id]=data;

}

});

renderPlayers(filtered);

};


/* =========================
   LEVEL ÄNDERN
========================= */

window.changeLevel=async function(id){

let value=
prompt(
"Neues Level für "+id+":"
);

if(value===null)return;

value=
Math.max(
1,
Math.min(
MAX_LEVEL,
Number(value)
)
);

await update(
ref(db,"players/"+id),
{
level:value,
updatedAt:Date.now()
}
);

loadPlayers();

};


/* =========================
   PUNKTE ÄNDERN
========================= */

window.changeScore=async function(id){

let value=
prompt(
"Neue Punkte für "+id+":"
);

if(value===null)return;

value=
Math.max(
0,
Number(value)
);

await update(
ref(db,"players/"+id),
{
score:value,
updatedAt:Date.now()
}
);

loadPlayers();

};


/* =========================
   RESET SPIELER
========================= */

window.resetPlayer=async function(id){

if(!confirm(
"Spielstand von "+id+
" wirklich zurücksetzen?"
))return;

await update(
ref(db,"players/"+id),
{
level:1,
score:0,
updatedAt:Date.now()
}
);

loadPlayers();

};


/* =========================
   SPERREN
========================= */

window.toggleBlock=async function(id){

const data=
allPlayers[id];

const newState=
data.blocked!==true;

await update(
ref(db,"players/"+id),
{
blocked:newState,
updatedAt:Date.now()
}
);

loadPlayers();

};


/* =========================
   LÖSCHEN
========================= */

window.deletePlayer=async function(id){

if(!confirm(
"Spieler "+id+
" endgültig löschen?"
))return;

await remove(
ref(db,"players/"+id)
);

loadPlayers();

};


/* =========================
   LOGOUT
========================= */

window.logout=async function(){

await signOut(auth);

show("home");

};


/* =========================
   SICHERER TEXT
========================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttr(value){

return String(value)
.replaceAll("\\","\\\\")
.replaceAll("'","\\'");

}


/* =========================
   START
========================= */

await loadGame();

createLevels();

console.log(
"⚽ Soccer gestartet:",
playerId
);

</script>

</body>
</html>
