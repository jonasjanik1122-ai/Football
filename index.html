<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07130d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Soccer Levels ⚽</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#07130d;color:white;text-align:center;min-height:100vh;overflow:hidden}
header{background:#0b2417;padding:15px;font-size:24px;font-weight:bold;color:#20d66b}
.screen{display:none;min-height:calc(100vh - 60px);padding:25px}
.active{display:block}
button{border:0;border-radius:12px;padding:14px 25px;margin:8px;background:#20d66b;color:#041008;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#16b957}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:500px;margin:30px auto}
.level{background:#12251a;color:white;padding:25px 5px;border-radius:15px}
.lock{opacity:.45}
#game{position:relative;background:#159447;border:5px solid white;border-radius:15px;max-width:600px;height:65vh;margin:auto;overflow:hidden}
.goal{position:absolute;top:10px;left:20%;width:60%;height:55px;border:5px solid white;background:#ffffff33}
.ball{position:absolute;font-size:45px;bottom:45px;left:calc(50% - 23px);transition:.3s}
.target{position:absolute;font-size:50px;top:100px;left:calc(50% - 25px)}
.info{display:flex;justify-content:space-around;margin:10px;font-size:18px}
#message{font-size:22px;margin:15px}
</style>
</head>

<body>

<header>⚽ Soccer Levels</header>

<!-- START -->
<div id="home" class="screen active">
<h1>Soccer Challenge</h1>
<p style="margin:20px">Schieße den Ball ins Tor und schaffe alle Levels!</p>
<button onclick="show('levels')">▶ Spielen</button>
</div>

<!-- LEVELAUSWAHL -->
<div id="levels" class="screen">
<h1>Level auswählen</h1>
<div class="levels" id="levelList"></div>
<button onclick="show('home')">⬅ Zurück</button>
</div>

<!-- SPIEL -->
<div id="play" class="screen">
<div class="info">
<span>Level: <b id="lvl">1</b></span>
<span>⚽ <b id="score">0</b></span>
<span>⏱️ <b id="time">30</b></span>
</div>

<div id="game">
<div class="goal">🥅</div>
<div class="target" id="target">🎯</div>
<div class="ball" id="ball">⚽</div>
</div>

<div id="message">Tippe auf den Ball!</div>
<button onclick="kick()">⚽ SCHIESSEN</button>
<button onclick="show('levels')">Level verlassen</button>
</div>

<script>
const maxLevels=12;
let current=1,score=0,time=30,timer=null,playing=false;

function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(id==='levels')createLevels();
 if(id!=='play')stopTimer();
}

function createLevels(){
 const box=document.getElementById('levelList');
 box.innerHTML='';
 for(let i=1;i<=maxLevels;i++){
  const b=document.createElement('button');
  b.className='level';
  b.textContent='Level '+i;
  b.onclick=()=>start(i);
  box.appendChild(b);
 }
}

function start(level){
 current=level;
 score=0;
 time=Math.max(10,35-level*2);
 document.getElementById('lvl').textContent=current;
 document.getElementById('score').textContent=score;
 document.getElementById('time').textContent=time;
 document.getElementById('message').textContent='Tippe auf SCHIESSEN!';
 show('play');
 playing=true;
 moveTarget();
 stopTimer();
 timer=setInterval(()=>{
  if(!playing)return;
  time--;
  document.getElementById('time').textContent=time;
  if(time<=0)end(false);
 },1000);
}

function moveTarget(){
 const t=document.getElementById('target');
 const x=10+Math.random()*80;
 const y=80+Math.random()*45;
 t.style.left=x+'%';
 t.style.top=y+'px';
}

function kick(){
 if(!playing)return;

 const target=document.getElementById('target');
 const ball=document.getElementById('ball');

 ball.style.bottom='75%';

 setTimeout(()=>{
  const hit=Math.random() < Math.max(.45,.85-current*.025);

  if(hit){
   score++;
   document.getElementById('score').textContent=score;
   document.getElementById('message').textContent='⚽ TOR!';
   if(score>=3+Math.floor(current/3)){
    end(true);
   }else{
    moveTarget();
    ball.style.bottom='45px';
   }
  }else{
   document.getElementById('message').textContent='❌ Daneben!';
   ball.style.bottom='45px';
  }
 },350);
}

function end(win){
 playing=false;
 stopTimer();
 if(win){
  document.getElementById('message').textContent='🏆 Level geschafft!';
  setTimeout(()=>{
   if(current<maxLevels)start(current+1);
   else{
    alert('🎉 Alle 12 Level geschafft!');
    show('levels');
   }
  },1000);
 }else{
  document.getElementById('message').textContent='⏰ Zeit abgelaufen!';
 }
}

function stopTimer(){
 if(timer){
  clearInterval(timer);
  timer=null;
 }
}

createLevels();

/* Fullscreen bei App-Nutzung */
document.addEventListener('click',()=>{
 if(document.documentElement.requestFullscreen &&
    !document.fullscreenElement){
  document.documentElement.requestFullscreen().catch(()=>{});
 }
},{once:true});
</script>

</body>
</html>
